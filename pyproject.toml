[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-churn"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "pandas==2.3.3", "scikit-learn==1.7.2", "mlflow==3.5.0",
 "fastapi==0.119.0", "pydantic==2.12.0", "streamlit==1.50.0",
 "uvicorn==0.37.0", "httpx==0.28.1", "matplotlib==3.10.7",
 "sqlalchemy==2.0.44", "numpy==2.3.4", "scipy==1.16.2", "joblib==1.5.2",
 "anyio==4.11.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.0"]

[tool.setuptools.packages.find]
include = ["churn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
